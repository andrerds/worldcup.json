<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copa do Mundo 2026</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .matches {
      display: grid;
      gap: 16px;
    }

    .match {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }

    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .score {
      font-size: 24px;
      color: #22c55e;
    }

    .info {
      color: #94a3b8;
      font-size: 14px;
    }

    .loading {
      color: #38bdf8;
    }
  </style>
</head>
<body>

<h1>🏆 Copa do Mundo 2026</h1>

<div id="content" class="loading">
  Carregando jogos...
</div>

<script>
async function carregarJogos() {
  try {

    // Exemplo apontando para JSON do GitHub Raw
    const url =
      "https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026--canada-mexico-usa/cup.json";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Erro ao carregar JSON");
    }

    const data = await response.json();

    const container = document.getElementById("content");

    console.log(data);

    const matches =
      data.matches ||
      data.rounds?.flatMap(r => r.matches) ||
      [];

    container.classList.remove("loading");

    container.innerHTML = `
      <div class="matches">
        ${matches.map(match => `
          <div class="match">
            <div class="teams">
              <span>${match.team1?.name || match.home_team || "TBD"}</span>

              <span class="score">
                ${match.score1 ?? "-"}
                x
                ${match.score2 ?? "-"}
              </span>

              <span>${match.team2?.name || match.away_team || "TBD"}</span>
            </div>

            <div class="info">
              📅 ${match.date || "Sem data"}
            </div>
          </div>
        `).join("")}
      </div>
    `;

  } catch (error) {
    console.error(error);

    document.getElementById("content").innerHTML = `
      Erro ao carregar os dados.
    `;
  }
}

carregarJogos();
</script>

</body>
</html>
